<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
    <main class="main bg-gray-800 bg-opacity-50 border border-purple-600 shadow-xl rounded-lg p-8 w-full max-w-md">
      <a href="/" class="flex justify-center mb-6">
        <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-12 filter brightness-125" />
      </a>
      <h1 class="text-2xl font-bold text-center text-purple-400 mb-6">Create Post</h1>

      <form name="createPost" class="space-y-6">
        <div>
          <label for="title" class="block text-sm font-medium text-purple-300">Title (Required)</label>
          <input type="text" id="title" name="title" required
                 class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
        </div>

        <div>
          <label for="body" class="block text-sm font-medium text-purple-300">Body (Optional)</label>
          <textarea name="body" id="body" 
                    class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>
        </div>

        <div>
          <label for="tags" class="block text-sm font-medium text-purple-300">Tags (Optional)</label>
          <input type="text" id="tags" name="tags"
                 class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
        </div>

        <div>
          <label for="mediaUrl" class="block text-sm font-medium text-purple-300">Image URL (Optional)</label>
          <input type="url" id="mediaUrl" name="mediaUrl"
                 class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
        </div>

        <div>
          <label for="mediaAlt" class="block text-sm font-medium text-purple-300">Image Alt text (Optional)</label>
          <input type="text" id="mediaAlt" name="mediaAlt"
                 class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
        </div>

        <button id="submitPost" type="submit" 
                class="w-full px-4 py-2 bg-purple-600 text-white font-semibold rounded-md shadow hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition ease-in-out duration-150">
          Create Post
        </button>
      </form>
    </main>
  </body>
</html>
