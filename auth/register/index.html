<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA - Register</title>
    <script type="module" src="/src/app.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>

  <body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
    <main class="main bg-gray-800 bg-opacity-50 border border-purple-600 shadow-xl rounded-lg p-8 w-full max-w-md">
      <a href="/" class="flex justify-center mb-6">
        <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-12 filter brightness-125" />
      </a>
      <h1 class="text-2xl font-bold text-center text-purple-400 mb-6">Register</h1>

      <form id="form" name="register" class="space-y-6">
        <div>
          <label id="registerName" for="name" class="block text-sm font-medium text-purple-300">Name</label>
          <input
            id="name"
            type="text"
            name="name"
            required
            maxlength="20"
            pattern="^[\w]+$"
            title="Please enter a username using only letters and numbers"
            class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
          />
        </div>

        <div>
          <label id="registerEmail" for="email" class="block text-sm font-medium text-purple-300">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            required
            pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
            title="Please enter a valid noroff.no or stud.noroff.no address"
            class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
          />
        </div>

        <div>
          <label id="registerPassword" for="password" class="block text-sm font-medium text-purple-300">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            required
            minlength="8"
            class="mt-1 block w-full px-3 py-2 bg-gray-700 text-white border border-purple-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
          />
        </div>

        <div class="flex items-center justify-between">
          <a href="/auth/login/" class="text-sm text-purple-400 hover:text-purple-500">Login instead</a>
          <button type="submit" class="px-4 py-2 bg-purple-600 text-white font-semibold rounded-md shadow hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition ease-in-out duration-150">
            Register
          </button>
        </div>
      </form>
      
      <div id="message" class="mt-6 text-center text-sm text-purple-400"></div>
    </main>
  </body>
</html>
